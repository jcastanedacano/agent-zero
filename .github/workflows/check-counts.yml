name: Check README counts

# Fails when a number quoted in README.md (modules, skills, KQL library queries,
# skill query files, tracks) no longer matches the files in the repository.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-counts.py
