id: inversion-001
name: Model Inversion via Reconstruction Prompts
category: model-inversion
severity: medium
platform:
  - foundry
surface: model-endpoint
permissions:
  required:
    - permission: Authorized access to call a deployed model endpoint (inference)
      resourceConstraints: An Entra identity with a role that can invoke the deployment, or a key when local authentication is enabled
description: |
  Prompts engineered to make a model complete, repeat, or recall something "verbatim" try to pull fragments of its training or grounding data back out through its
  responses, rather than inferring whether a record was present (membership inference, inference-001) or mapping the model's behavior broadly (extraction-001).
  The target is content: names, identifiers, or passages the model should not be reproducing.

graph:
  nodes:
    - { id: atacante, label: Attacker, sub: Reconstruction-style prompts, type: attacker, x: 100, y: 200 }
    - { id: endpoint, label: Microsoft Foundry Endpoint, sub: Deployed model, type: asset, x: 420, y: 200 }
    - { id: reconstruido, label: Reconstructed fragment, sub: Verbatim or near-verbatim training content, type: victim, x: 740, y: 200 }
  edges:
    - { from: atacante, to: endpoint, label: Completion/repetition-style query loop }
    - { from: endpoint, to: reconstruido, label: Returns content resembling training data }

recommendation: |
  As with inference-001, the honest state of P03-Q8 is that it is a documented pattern, not a working query against this environment's telemetry: it needs prompt text
  that Microsoft Learn says advanced hunting does not yet surface for AI inference calls. Rely on the resource's own diagnostic-log volume signal in the meantime, and
  consider content filtering or system-prompt instructions that refuse verbatim-reproduction requests as a model-side mitigation, independent of whether the log-based
  detection ever fires.

  Detection: AzureDiagnostics (operation create-response) gives volume and caller IP today. P03-Q8's keyword/identifier scoring on prompt text is not yet exercisable
  against real telemetry; treat it as a target to revisit once prompt text is surfaced in advanced hunting, not as a working rule.
detection:
  library:
    - P03-Q8
  gaps:
    - P03-Q8 needs RawEventData.UserPrompt from CloudAppEvents for both its keyword scoring and its identifier-pattern matching; Microsoft Learn lists that field as not yet surfaced in advanced hunting, and the validation tenant recorded 0 agent ActionTypes on that table for direct endpoint calls. No currently-working query distinguishes a reconstruction-style probe from an ordinary question or from systematic extraction (P03-Q6).
    - "P03-Q8's actual filter is only ModelInversionScore >= 4; TotalQueries > 50 and DistinctPrompts > 30 are optional 2-point bonuses toward that score, not independent hard requirements — a request can qualify on keyword and identifier bonuses alone (up to 6 points) without either. This lab's demo (40 requests, 4 templates, no personal-identifier matches) would score at most 3 and fall short of >= 4 even if the prompt-text columns existed; treating an empty result as confirmation of the telemetry gap alone, without checking this scoring shortfall separately, overstates what an empty result actually proves. Readers should not conclude low-volume probes are categorically undetectable by this query."
frameworks:
  atlas:
    - AML.T0024.001
validation:
  status: documented
  date: 2026-10-22
  notes: >-
    Written from the KQL-Library's own documented note on P03-Q8 (prompt text not yet surfaced in advanced hunting, 0 agent ActionTypes observed in the validation tenant)
    and from extraction-001's already-validated AzureDiagnostics pattern. Not run end to end against a tenant for this file: no reconstruction-style query loop was actually
    sent, and no diagnostic-log row was captured.

lab:
  kind: tenant-exercise
  effects: read-only
  title: Ask it to repeat itself, verbatim
  objective: Send a loop of reconstruction-style queries against a deployed model endpoint, and see what the resource's own diagnostic logs can and cannot tell you about the attempt.
  estimatedMinutes: 12
  costEstimate: "Low: 40 small Responses API calls against a demo deployment. Not measured otherwise."
  licenses:
    - Microsoft Foundry with a deployed model endpoint in a demo environment
    - An API key or an Entra identity authorized to call the deployment
    - Azure Cloud Shell in Bash, or a local terminal with curl
    - Diagnostic settings on the Microsoft Foundry resource that send logs to Log Analytics
  safety:
    scope: Demo tenant and demo deployment only. Forty calls are a small, bounded load; do not point the script at a shared or production endpoint, and do not probe for real people's identifying details.
    writes: None beyond 40 inference requests and whatever the endpoint logs for them (store:false set on the payload). No data is created or changed.
    revert: Nothing to revert.
  architecture:
    summary: "One script, run once, sending 40 reconstruction-style requests (4 rotating prompt templates) to one deployed model endpoint directly with curl. Everything about the loop mechanics is identical to extraction-001's and inference-001's; only the prompt content differs."
    resources:
      - name: Microsoft Foundry deployment
        purpose: The target endpoint. Already exists; nothing new is deployed for this lab.
        createdBy: existing
    principals:
      - name: Caller identity or API key
        required:
          - Authorization to invoke the deployment (an Entra role that can call it, or a key when local auth is enabled)
        helpful: []
  flow:
    setup:
      - In the Microsoft Foundry portal, open the deployment's Details page and copy the Endpoint and the deployment name. Keep the Key out of the command line and out of screenshots; the script reads it with read -rs.
      - Confirm a diagnostic setting on the resource sends logs to Log Analytics, since that is the only place this traffic is expected to show up.
    attack:
      - step: 'Open Cloud Shell in Bash and run a loop of 40 Responses API requests, rotating through 4 reconstruction-style prompt templates, one second apart.'
        evidence: The loop prints a count per HTTP status, the same shape as the other two inference-pattern labs.
      - step: Query the resource's own diagnostic logs (AzureDiagnostics, operation create-response) for the per-caller request count over the same window.
        evidence: One row with about 40 calls attributable to the caller IP, indistinguishable in this log from inference-001's or extraction-001's runs.
      - step: Attempt to run P03-Q8 (the model-inversion KQL-Library query) against CloudAppEvents for the same window.
        evidence: "No rows, by design of the exercise, for two independent reasons: this call path does not populate the Application/ActionType/RawEventData fields P03-Q8 depends on, and separately, this run's score (at most 3) would fall below the ModelInversionScore >= 4 threshold the query also requires. Either reason alone would produce an empty result; this exercise cannot distinguish which one is actually at fault, which is itself part of the gap documented above."
    cleanup: []
    teardown: []
  defend:
    prevent:
      - Disable key authentication on the resource (disableLocalAuth, or the Azure Policy that requires it) so Microsoft Entra ID is the only way in.
      - Where the model platform supports it, configure content filtering or system instructions that refuse verbatim-reproduction and "what do you remember" style requests, as a model-side mitigation independent of log-based detection.
      - Rate-limit or alert on volume by caller using the resource's own diagnostic logs, since it is the only signal currently available for this call path.
    detect:
      queries:
        - P03-Q8
      events:
        - source: AzureDiagnostics
          operation: create-response volume above threshold, by caller IP, within a window
          note: "The only signal actually exercised for this lab. It confirms volume, not query content, so it cannot by itself confirm model inversion specifically."
        - source: CloudAppEvents
          operation: InvokeAgent / InferenceCall prompt keyword and identifier scoring (P03-Q8)
          note: "NOT EXERCISABLE today. Depends on RawEventData.UserPrompt, which Microsoft Learn lists as not yet surfaced in advanced hunting for AI inference calls, and which this call path (a direct endpoint call, not an agent run) would not populate even if it were."
  transcript:
    summary: Not run. This lab was written from the KQL-Library's own documented note on P03-Q8 and from extraction-001's validated AzureDiagnostics pattern, not reproduced against a tenant for this file.
    observations: []
  validation:
    status: documented
    date: 2026-10-22
    notes: Written from documented sources (the KQL-Library's P03-Q8 note, extraction-001's validated run). No query loop, diagnostic-log check, or CloudAppEvents check was run against a tenant for this file.
