id: entra-001
name: Application.ReadWrite.All
category: credential-access
severity: high
platform: [entra, graph]
surface: directory

permissions:
  required:
    - permission: Application.ReadWrite.All (Microsoft Graph application permission), or the Application Administrator or Cloud Application Administrator role
      resourceConstraints: Can add a credential to any app registration or service principal in scope; Application.ReadWrite.OwnedBy limits this to apps the principal owns
  additional:
    - permission: Application.Read.All
      resourceConstraints: Helps find which applications hold privileged permissions or roles

description: |
  A principal that can manage applications can add a new client secret or certificate to an existing application or service principal, then sign in as it. If the
  target holds privileged Microsoft Graph permissions or directory roles, the new credential inherits that power. The abuse changes who can act as the application
  without touching its permissions, so a permission review of the target does not show it.

graph:
  nodes:
    - id: actor
      label: Principal with Application.ReadWrite.All
      sub: Or Application/Cloud Application Administrator
      type: attacker
    - id: target
      label: A more privileged application
      sub: Holds Graph permissions or directory roles the actor lacks
      type: asset
    - id: credential
      label: New client secret or certificate
      sub: Added to the target; not shown as a permission change
      type: asset
    - id: inherited
      label: Signs in as the target application
      sub: Inherits everything it can do
      type: agent
  edges:
    - from: actor
      to: target
      label: Adds a credential
    - from: target
      to: credential
      label: Credential created
    - from: credential
      to: inherited
      label: Authenticates with it
prerequisites:
  - At least one application or service principal in the tenant holds more privilege than the abusing principal
  - Nothing blocks adding a credential to it (see limitations)

limitations: |
  App management policies can restrict or forbid password credentials and limit their lifetime; the app instance property lock restricts changes to a
  multi-tenant app's service principal. Tenant protections change over time: check the current behaviour for the role and permission in use.

recommendation: |
  Treat Application.ReadWrite.All and the application administrator roles as tier-0 for every privileged application. Use Application.ReadWrite.OwnedBy where an
  application only manages its own apps. Enforce app management policies (no password credentials, short lifetimes, certificates only) and require Conditional
  Access for workload identities where supported. Remove unused credentials and review credential age.

  Detect credential additions: `AuditLogs` operations "Update application – Certificates and secrets management" and "Add service principal credentials", alerting
  when the actor is not an expected automation identity or the target holds privileged permissions.

detection:
  library:
    - KQL-Library/P03-Access-Anomalies.kql (Q12, credential changes on agent identity objects only)
  gaps:
    - No query covers credential changes on non-agent applications. The operation names above come from knowledge of Entra audit logs and have NOT been run in this repository.

references:
  - https://learn.microsoft.com/graph/permissions-reference
  - https://learn.microsoft.com/entra/identity/monitoring-health/reference-audit-activities

frameworks:
  attack: [T1098.001]

validation:
  status: not-verified
  date: 2026-10-20
  notes: Written from documentation and public research. Nothing was run against a tenant; the audit operation names and the current effect of app management policies must be checked before relying on them.

lab:
  kind: tenant-exercise
  title: A credential that borrows someone else's privilege
  objective: Add a client secret to an application that holds more privilege than you do, sign in as it, and confirm the new credential inherits that privilege with no change to the target's own permissions — then repeat it against a target protected by an app management policy and show the add itself gets rejected.
  estimatedMinutes: 30
  costEstimate: "None beyond the tenant's existing Microsoft Graph PowerShell access. Not measured otherwise."
  licenses:
    - A demo tenant with two throwaway applications: one target with a privileged Microsoft Graph application permission (read-only is enough to prove the point) and no app management policy, one identical target protected by an app management policy that blocks password credentials
    - An account with Application.ReadWrite.All, or Application Administrator / Cloud Application Administrator, scoped to the demo tenant
    - Microsoft Graph PowerShell SDK (New-MgApplicationPassword or New-MgServicePrincipalPasswordCredential, and Connect-MgGraph with a client secret credential)
  safety:
    scope: Demo tenant only. Target only throwaway applications you create for this exercise, never a real one, even in a demo tenant.
    writes: Two throwaway applications, each with one added client secret (the hardened target's add is expected to be rejected, not to land).
    revert: Delete both applications; this removes both the apps and the credentials in one step (see teardown).
  architecture:
    summary: Two otherwise-identical demo applications, each holding one privileged Microsoft Graph application permission. The only difference is that one has an app management policy applied to it that forbids password credentials.
    resources:
      - name: lab-entra001-target (application + service principal)
        purpose: Holds a privileged Graph application permission (for example Directory.Read.All) and nothing else. No app management policy applied.
        createdBy: manual
      - name: lab-entra001-target-hardened (application + service principal)
        purpose: Identical to the first, but with an app management policy applied that restricts or forbids password credentials.
        createdBy: manual
    principals:
      - name: Account performing the credential add
        required:
          - Application.ReadWrite.All, or the Application Administrator / Cloud Application Administrator role
        helpful:
          - Application.Read.All, to find which applications hold privileged permissions in the first place
  flow:
    setup:
      - Create lab-entra001-target with one privileged, read-only Graph application permission granted (admin consent completed), and confirm no app management policy is applied to it.
      - Create lab-entra001-target-hardened identically, then apply an app management policy to it that restricts or forbids password credentials, and confirm the policy is in effect.
    attack:
      - step: Against lab-entra001-target, add a new client secret with New-MgApplicationPassword (or New-MgServicePrincipalPasswordCredential against its service principal).
        evidence: The call succeeds and returns a new secret value.
      - step: Authenticate as lab-entra001-target using the new secret (Connect-MgGraph with a client secret credential) and call the Graph endpoint the privileged permission grants access to.
        evidence: The call succeeds, proving the new credential inherited the target's existing privilege with no change to the target's own permission grants.
      - step: Re-check the target's API permissions in the admin center or via Get-MgServicePrincipal.
        evidence: The permission list is unchanged; nothing about this step is visible from a permissions review, only from a credentials review.
      - step: Repeat the same credential add against lab-entra001-target-hardened.
        evidence: The call is rejected by the app management policy; record the exact error returned.
    cleanup:
      - Remove the added credential from lab-entra001-target if you want to keep the application for further testing; otherwise proceed to teardown.
    teardown:
      - Delete both lab-entra001-target and lab-entra001-target-hardened, and remove the app management policy created for the exercise.
  defend:
    prevent:
      - Treat Application.ReadWrite.All and the application administrator roles as tier-0 for every privileged application in the tenant, not only for directory-role holders.
      - Use Application.ReadWrite.OwnedBy instead, wherever an application only needs to manage applications it owns.
      - Enforce app management policies tenant-wide or per-application: no password credentials, short certificate lifetimes, as demonstrated by the hardened target in this lab.
      - Require Conditional Access for workload identities where supported, and review credential age on every privileged application on a schedule.
    detect:
      events:
        - source: AuditLogs
          operation: Update application – Certificates and secrets management, and Add service principal credentials
          note: "NOT VERIFIED. These operation names come from knowledge of Entra audit logs, not from a query run against a tenant for this file; confirm the exact operation names on your own tenant before building an alert on them. No query in this repository's KQL library covers credential changes on a non-agent application; P03's credential-change query (Q12) covers agent identity objects only."
  transcript:
    summary: Not run. This lab was written from the path's own description and from the app-management-policy control named in its limitations, not reproduced against a tenant for this file.
    observations: []
  validation:
    status: not-verified
    date: 2026-10-21
    notes: Written from documentation and public research, same as the path itself. Nothing in this lab — the credential add, the sign-in, or the app management policy's current rejection behaviour — was run against a tenant for this file.
