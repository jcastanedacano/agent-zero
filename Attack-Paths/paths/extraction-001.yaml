id: extraction-001
name: Model Extraction via Systematic Inference
category: model-extraction
severity: medium
platform:
  - foundry
surface: model-endpoint
permissions:
  required:
    - permission: Authorized access to call a deployed model endpoint (inference)
      resourceConstraints: An Entra identity with a role that can invoke the deployment, or a key when local authentication is enabled
description: Low-volume, systematic queries against an inference endpoint allow reconstructing the model’s behavior without direct access to its weights.
graph:
  nodes:
    - id: atacante
      label: Attacker
      sub: Azure CLI / Cloud Shell
      type: attacker
      x: 100
      y: 200
    - id: endpoint
      label: Azure AI Foundry Endpoint
      sub: Deployed model
      type: asset
      x: 420
      y: 200
    - id: respuestas
      label: Extracted behavior
      sub: 50+ systematic queries
      type: victim
      x: 740
      y: 200
  edges:
    - from: atacante
      to: endpoint
      label: Query loop (50 requests)
    - from: endpoint
      to: respuestas
      label: Accumulates response pattern
workshop:
  estimatedMinutes: 12
  steps:
    - In the demo Azure AI Foundry environment, locate a deployed model endpoint.
    - Open Azure Cloud Shell or a local terminal with Azure CLI authenticated.
    - Run the simulation script (replace <endpoint> and <api-key>).
    - When the script finishes, check the analytics rule threshold.
  payload: |-
    # Simulates systematic model extraction (50 queries for the demo)
    # Real extraction uses 500+/hour; this simulates the pattern.
    for i in $(seq 1 50); do
      curl -s -X POST "<endpoint>/chat/completions" \
        -H "api-key: <api-key>" \
        -H "Content-Type: application/json" \
        -d "{\"messages\":[{\"role\":\"user\",\"content\":\"Question $i: $(cat /dev/urandom | head -c 20 | base64)\"}],\"max_tokens\":50}" \
        > /dev/null
      sleep 1
    done
    echo "50 extraction queries sent"
  verificationQuery: |-
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | where Application in ("Azure AI Foundry", "Azure OpenAI")
        and ActionType in ("InvokeAgent", "InferenceCall")
    | summarize QueryCount = count() by bin(TimeGenerated, 1h), AccountDisplayName
    | where QueryCount > 20  // Lowered for the demo (production threshold: 500)
  expected: You should see a row with QueryCount around 50 for the identity that ran the script, above the demo’s threshold of 20.
  ifItFails:
    - condition: The script finishes but the query shows no results
      explanation: 'Confirm Application matches exactly "Azure AI Foundry" or "Azure OpenAI" in your environment: the exact name can vary by diagnostic connector version. Also, this simulation calls the model endpoint directly and is not an agent run: Agent 365 observability telemetry (InvokeAgent, InferenceCall) does not capture it, so check the diagnostic logs of the Azure OpenAI or Foundry resource for the per-caller count.'
  documentationQuestions:
    - At what query count did the rule fire?
    - What is the minimum rate an attacker needs to stay under to evade detection?
    - What does that imply for your threshold?
  source: Track-C-SOC-Engineer/Module-06-RedTeamPerspective.md
recommendation: |-
  Per-identity rate limiting in Azure AI Foundry + a Conditional Access policy that blocks unauthorized identities (Session 03, Secure Access).

  Detection rule: Agentic AI Volume Spike Anomaly (compares hourly volume per AgentId against an 8-day moving baseline, fires above 3 standard deviations; see the P05-Q2 exercise in Session 05). P03-Q6 is the fixed-threshold variant (>500 queries/hour) for simpler detection.
detection:
  library:
    - P03-Q6
frameworks:
  atlas:
    - AML.T0040
  owasp:
    - LLM06
validation:
  status: documented
  date: 2026-10-21
  notes: Workshop exercise of Track C, Module 06, run against a demo tenant. Per-step evidence is not recorded in this file. The detection query carries its own validation status in the KQL library.

lab:
  kind: tenant-exercise
  effects: read-only
  title: Fifty questions, no agent in sight
  objective: Call a deployed model endpoint directly, 50 times in a tight loop, and see whether the volume-anomaly rule written for agent telemetry notices a caller that never goes through an agent at all.
  estimatedMinutes: 12
  costEstimate: "Low: 50 small chat-completion calls against a demo deployment. Not measured otherwise."
  licenses:
    - Azure AI Foundry with a deployed model endpoint in a demo environment
    - An API key or an Entra identity authorized to call the deployment
    - Azure CLI (Cloud Shell or local) for the query loop
    - Diagnostic logs enabled on the Foundry or Azure OpenAI resource
  safety:
    scope: Demo tenant and demo deployment only. Fifty calls are a small, bounded load; do not point the script at a shared or production endpoint.
    writes: None beyond 50 inference requests and whatever the endpoint logs for them. No data is created or changed.
    revert: Nothing to revert.
  architecture:
    summary: "One script, run once, calling one deployed model endpoint directly with curl — no agent, no Copilot, no Foundry agent runtime in the loop. That absence is the point: this traffic will not carry an AgentId."
    resources:
      - name: Azure AI Foundry deployment
        purpose: The target endpoint. Already exists; nothing new is deployed for this lab.
        createdBy: existing
    principals:
      - name: Caller identity or API key
        required:
          - Authorization to invoke the deployment (an Entra role that can call it, or a key when local auth is enabled)
        helpful: []
  flow:
    setup:
      - Locate a deployed model endpoint in the demo Foundry environment and confirm you can reach it with curl and either an API key or a bearer token.
      - Confirm diagnostic logging is enabled on the resource, since that is the only place this traffic is expected to show up.
    attack:
      - step: 'Open Cloud Shell or a local terminal with the Azure CLI authenticated, and run a loop of 50 chat-completion requests, each with a distinct random-looking question, one second apart (real extraction uses 500+/hour; 50 is the demo-scale version of the same pattern).'
        evidence: The script completes and prints a count of 50 sent requests.
      - step: Query CloudAppEvents for Azure AI Foundry or Azure OpenAI InvokeAgent/InferenceCall activity in the last hour.
        evidence: "Most likely, nothing: this call path does not go through an agent run, so it is not expected to carry Agent 365 observability ActionTypes at all. An empty result here is the expected outcome, not a failure — it is what motivates the next step."
      - step: Check the Azure OpenAI or Foundry resource's own diagnostic logs for the per-caller request count over the same window.
        evidence: Approximately 50 requests attributable to the caller identity or key used, in the diagnostic logs rather than in CloudAppEvents.
    cleanup: []
    teardown: []
  defend:
    prevent:
      - Enforce per-identity rate limiting on the Foundry deployment itself, independent of any agent-layer control.
      - Pair it with a Conditional Access policy that blocks unauthorized identities from reaching the endpoint at all (demo-tenant equivalent of the Secure Access session referenced in the source module).
    detect:
      queries:
        - P03-Q6
      events:
        - source: CloudAppEvents
          operation: InvokeAgent / InferenceCall volume above threshold, by caller, within an hour
          note: "Per the KQL library's own note on P03-Q6: the ActionType values this query depends on are the current Agent 365 observability ones, and this exercise's own direct-endpoint call path is NOT an agent run, so it is not expected to populate them. The actual signal for this attack lives in the Azure OpenAI/Foundry resource's diagnostic logs, not in CloudAppEvents; this query stays correct for genuinely agent-mediated volume spikes, which is a different attack than the one simulated here."
  transcript:
    summary: Not run in this repository. The script and the telemetry caveat come from Track C, Module 06 (Attack 3), itself written as instructional content for a demo-tenant workshop.
    observations: []
  validation:
    status: documented
    date: 2026-10-21
    notes: This lab restructures the Module 06, Attack 3 exercise into the path/lab schema. It was not independently run for this file; the module's own text already states the validation tenant had no agent ActionTypes in CloudAppEvents in the 30 days checked, and that caveat is carried over rather than resolved here.
