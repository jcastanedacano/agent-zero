id: chain-001
name: "JadePuffer: Agentic Ransomware Chain"
category: agentic-ransomware
severity: critical
platform:
  - agent-builder
  - langflow
  - key-vault
  - sharepoint
surface: agent-lifecycle
permissions:
  required:
    - permission: An ungoverned agent with broad permissions (see builder-001) and an initial foothold
      resourceConstraints: The lab uses a deliberately vulnerable Langflow (CVE-2025-3248) as the initial access
description: 7-stage chain where an autonomous agent runs the entire intrusion (from initial access to encryption) with adaptive decision-making at each stage, with no pauses or fatigue.
graph:
  nodes:
    - id: langflow
      label: 1. Langflow (CVE-2025-3248)
      sub: Unauthenticated RCE (initial access)
      type: attacker
      x: 60
      y: 220
    - id: agente
      label: Autonomous agent
      sub: Via Agent Builder Bypass (Attack 2)
      type: agent
      x: 300
      y: 100
    - id: discovery
      label: 2. Discovery
      sub: Sites, users, connected services
      type: asset
      x: 540
      y: 220
    - id: creds
      label: 3. Credentials
      sub: Key Vault, env vars, config docs
      type: asset
      x: 780
      y: 100
    - id: lateral
      label: 4. Lateral movement
      sub: New group or role
      type: asset
      x: 1020
      y: 220
    - id: exfil
      label: 5-7. Exfiltration + Encryption
      sub: 20+ files, then ransom
      type: victim
      x: 1260
      y: 100
  edges:
    - from: langflow
      to: agente
      label: Initial access
    - from: agente
      to: discovery
      label: Enumerates
    - from: discovery
      to: creds
      label: Hunts for secrets
    - from: creds
      to: lateral
      label: Pivots
    - from: lateral
      to: exfil
      label: Escalates + executes
workshop:
  estimatedMinutes: 20
  steps:
    - Use the Agent Builder Bypass from Attack 2 to create an ungoverned agent with broad permissions.
    - "Simulate Stage 2 (discovery): have the agent enumerate SharePoint sites, user lists, and connected services via legitimate tool calls."
    - "Simulate Stage 3 (credential access): query Key Vault (read), environment variables via Foundry, and any API keys in config documents."
    - "Simulate Stage 4 (lateral movement): attempt to add the agent to an additional group or role."
    - "Simulate Stage 7 (mass file operation): download or copy 20+ files in a single session from different sites."
  verificationQuery: |-
    // P05-Q8: confirms that the chain correlation fires
    // Checks whether 3+ stages showed up from the same AgentId within 60 minutes
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | extend AgentId = tostring(RawEventData["AgentId"])
    | where isnotempty(AgentId)
    | summarize
        ActionTypes = make_set(ActionType),
        ActionCount = count(),
        UniqueActionTypes = dcount(ActionType)
        by AgentId, AccountDisplayName
    | where UniqueActionTypes >= 5
    | project AgentId, AccountDisplayName, ActionCount, UniqueActionTypes, ActionTypes,
        RiskNote = "Agent executing high action-type diversity in 1h (multi-stage chain candidate)"
  expected: You should see a row with UniqueActionTypes >= 5 for the AgentId that ran the 4 simulated stages, before reaching a full Stage 7.
  ifItFails:
    - condition: The query does not correlate any stage
      explanation: "Confirm all stages ran under the same AgentId (the same agent created in step 1, not a new one per stage): the correlation depends on that."
  documentationQuestions:
    - Did P05-Q8 fire before reaching Stage 7 (encryption)?
    - What was the minimum number of stages required to trigger the alert?
    - If the agent operated at lower volume per stage to evade detection, at what rate would it become invisible?
    - What is the difference in time-to-detection between a human-operated attack (intermittent) and this agent-operated chain (continuous)?
  source: Track-C-SOC-Engineer/Module-06-RedTeamPerspective.md
recommendation: |-
  Defense in depth: Agent Builder governance (Session 02) prevents the ungoverned agent from Stage 1; Global Secure Access (Session 03) blocks connections to uncategorized MCP servers at the network level; and hardening internet-exposed AI platforms (patching Langflow, no public exposure without a WAF) closes the original entry point.

  Detection rule: P05-Q8 (chain correlation: 3 or more distinct stages from the same AgentId within a 60-minute window). No dedicated rule name in the workshop playbook.
detection:
  library:
    - P05-Q8
  suggestedRule:
    name: Agentic Multi-Stage Attack Chain Correlation (Proposed)
    severity: Critical
    frequency: Scheduled query, every 5 min (P05-Q8)
frameworks:
  atlas:
    - AML.T0051
    - AML.T0040
  owasp:
    - ASI04
    - ASI05
validation:
  status: documented
  date: 2026-10-21
  notes: Workshop exercise of Track C, Module 06, run against a demo tenant. Per-step evidence is not recorded in this file. The detection query carries its own validation status in the KQL library.

lab:
  kind: tenant-exercise
  title: One agent, four stages, no human pause
  objective: Simulate the observable middle of the JadePuffer pattern — discovery, credential access, lateral movement, bulk file operation — under one agent identity in a compressed window, and see whether the chain-correlation rule fires before you reach the stage that would matter in a real incident.
  estimatedMinutes: 25
  costEstimate: "Low: the simulated stages use existing SharePoint sites, an existing Key Vault and the Foundry resource from builder-001; no new paid resources. Not measured otherwise."
  licenses:
    - The ungoverned agent from builder-001 (this lab reuses it rather than recreating it)
    - A Key Vault with at least one secret the agent's identity can read
    - SharePoint sites with files the agent can enumerate and copy
    - A group or role the agent can attempt to add itself to
    - Log Analytics workspace ingesting CloudAppEvents
  safety:
    scope: Demo tenant only. This lab never encrypts or deletes anything; "Stage 7" is simulated as a bulk download or copy, which is reversible, not as destruction.
    writes: Read access to Key Vault secrets and environment variables, a bulk copy or download of 20+ files, and one attempted (and ideally rejected) group or role membership change.
    revert: Remove any group or role membership the attempt actually succeeded in creating, and delete the copied files from wherever the agent placed them.
  architecture:
    summary: "The same ungoverned agent created in builder-001 is driven through four of the seven JadePuffer stages by hand, one legitimate-looking tool call at a time, inside a 60-minute window, so the correlation query has something to correlate. Stage 1 (the real Langflow CVE-2025-3248 exploit) and the final encryption/ransom stages are out of scope: this lab tests the detection signal, not the exploit chain."
    resources:
      - name: red-team-test-agent (from builder-001)
        purpose: Drives all four simulated stages under one AgentId, which is what the correlation query keys on.
        createdBy: existing
      - name: Key Vault
        purpose: Target for the simulated credential-access stage (a read of an existing secret, nothing new provisioned).
        createdBy: existing
      - name: SharePoint sites
        purpose: Target for the discovery and bulk-file-operation stages.
        createdBy: existing
      - name: Log Analytics workspace
        purpose: Receives CloudAppEvents, the table the chain-correlation query reads.
        createdBy: existing
    principals:
      - name: red-team-test-agent's identity
        required:
          - Whatever broad permissions it already holds from the builder-001 exercise (the point of this lab is that no additional grant is needed)
        helpful: []
  flow:
    setup:
      - Confirm the agent from builder-001 is still available and that you can drive it through a conversation that results in real tool calls, not just text.
      - Note the agent's AgentId if you can find it, so you can filter the correlation query to it specifically while other tenant activity is happening.
    attack:
      - step: 'Stage 2, discovery: ask the agent to enumerate SharePoint sites, list users, and list connected services, through its own tool calls, not through you doing it manually.'
        evidence: The agent's tool-call log shows at least one SharePoint, directory or service-enumeration call completed.
      - step: 'Stage 3, credential access: ask the agent to read a Key Vault secret, check Foundry environment variables, and look for API keys in any configuration documents it can reach.'
        evidence: At least one credential- or secret-read tool call completes, against an existing demo secret, not a real one.
      - step: 'Stage 4, lateral movement: ask the agent to add itself (or a service principal it controls) to an additional group or role.'
        evidence: 'The attempt is made and its result (accepted or rejected) is recorded; a rejection is itself useful evidence about where the chain would actually stop.'
      - step: 'Stage 7, bulk file operation: ask the agent to download or copy 20 or more files, from more than one site, in a single session.'
        evidence: A bulk copy or download tool call completes against the demo sites, and the files land somewhere you can delete them from afterward.
      - step: Run the chain-correlation query, scoped to the agent's AgentId if you captured it, before and after the four simulated stages.
        evidence: Whether UniqueActionTypes reaches the rule's threshold (5) for that AgentId, and at which stage count it first does.
    cleanup:
      - Delete or revert any file copies the bulk-operation stage produced.
      - Remove the group or role membership from Stage 4 if it was accepted.
    teardown:
      - No infrastructure beyond builder-001's agent was created; tearing that agent down (see builder-001's lab) removes the identity this lab drove.
  defend:
    prevent:
      - Close the entry point this chain assumes: Agent Builder governance (builder-001's own defend.prevent) stops the ungoverned agent that makes stages 2-7 possible in the first place.
      - Patch and harden any internet-exposed AI development platform (Langflow, Flowise, n8n, Dify) with the same rigor as a production system; do not expose one without a WAF.
      - Monitor for compressed multi-stage chains from a single agent identity: the signal is how many distinct action types appear close together in time, not the severity of any one action.
    detect:
      queries:
        - P05-Q8
      events:
        - source: CloudAppEvents
          operation: 3 or more distinct high-level action-type categories from the same AgentId within a 60-minute window
          note: "Per the KQL library's own note on this query: it runs without errors in Advanced Hunting as of October 2026, but had 0 agent ActionTypes to correlate on the validation tenant, so it has not been run against live events. Confirm on your own tenant's real telemetry, not just that the query parses."
  transcript:
    summary: Not run in this repository. The steps and the stage table come from Track C, Module 06 (Attack 6, the JadePuffer simulation), itself written as instructional content for a demo-tenant workshop.
    observations: []
  validation:
    status: documented
    date: 2026-10-21
    notes: This lab restructures the Module 06, Attack 6 exercise into the path/lab schema. It was not independently run for this file; it depends on builder-001's lab for the agent identity, and the detection query's "not run against live events" status is carried over from the KQL library rather than resolved here.
