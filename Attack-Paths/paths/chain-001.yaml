id: chain-001
name: "JadePuffer: Agentic Ransomware Chain"
category: agentic-ransomware
severity: critical
platform:
  - agent-builder
  - langflow
  - key-vault
  - sharepoint
surface: agent-lifecycle
permissions:
  required:
    - permission: An ungoverned agent with broad permissions (see builder-001) and an initial foothold
      resourceConstraints: The lab uses a deliberately vulnerable Langflow (CVE-2025-3248) as the initial access
description: 7-stage chain where an autonomous agent runs the entire intrusion (from initial access to encryption) with adaptive decision-making at each stage, with no pauses or fatigue.
graph:
  nodes:
    - id: langflow
      label: 1. Langflow (CVE-2025-3248)
      sub: Unauthenticated RCE (initial access)
      type: attacker
      x: 60
      y: 220
    - id: agente
      label: Autonomous agent
      sub: Via Agent Builder Bypass (Attack 2)
      type: agent
      x: 300
      y: 100
    - id: discovery
      label: 2. Discovery
      sub: Sites, users, connected services
      type: asset
      x: 540
      y: 220
    - id: creds
      label: 3. Credentials
      sub: Key Vault, env vars, config docs
      type: asset
      x: 780
      y: 100
    - id: lateral
      label: 4. Lateral movement
      sub: New group or role
      type: asset
      x: 1020
      y: 220
    - id: exfil
      label: 5-7. Exfiltration + Encryption
      sub: 20+ files, then ransom
      type: victim
      x: 1260
      y: 100
  edges:
    - from: langflow
      to: agente
      label: Initial access
    - from: agente
      to: discovery
      label: Enumerates
    - from: discovery
      to: creds
      label: Hunts for secrets
    - from: creds
      to: lateral
      label: Pivots
    - from: lateral
      to: exfil
      label: Escalates + executes
workshop:
  estimatedMinutes: 20
  steps:
    - Use the Agent Builder Bypass from Attack 2 to create an ungoverned agent with broad permissions.
    - "Simulate Stage 2 (discovery): have the agent enumerate SharePoint sites, user lists, and connected services via legitimate tool calls."
    - "Simulate Stage 3 (credential access): query Key Vault (read), environment variables via Foundry, and any API keys in config documents."
    - "Simulate Stage 4 (lateral movement): attempt to add the agent to an additional group or role."
    - "Simulate Stage 7 (mass file operation): download or copy 20+ files in a single session from different sites."
  verificationQuery: |-
    // P05-Q8: confirms that the chain correlation fires
    // Checks whether 3+ stages showed up from the same AgentId within 60 minutes
    CloudAppEvents
    | where TimeGenerated > ago(1h)
    | extend AgentId = tostring(RawEventData["AgentId"])
    | where isnotempty(AgentId)
    | summarize
        ActionTypes = make_set(ActionType),
        ActionCount = count(),
        UniqueActionTypes = dcount(ActionType)
        by AgentId, AccountDisplayName
    | where UniqueActionTypes >= 5
    | project AgentId, AccountDisplayName, ActionCount, UniqueActionTypes, ActionTypes,
        RiskNote = "Agent executing high action-type diversity in 1h (multi-stage chain candidate)"
  expected: You should see a row with UniqueActionTypes >= 5 for the AgentId that ran the 4 simulated stages, before reaching a full Stage 7.
  ifItFails:
    - condition: The query does not correlate any stage
      explanation: "Confirm all stages ran under the same AgentId (the same agent created in step 1, not a new one per stage): the correlation depends on that."
  documentationQuestions:
    - Did P05-Q8 fire before reaching Stage 7 (encryption)?
    - What was the minimum number of stages required to trigger the alert?
    - If the agent operated at lower volume per stage to evade detection, at what rate would it become invisible?
    - What is the difference in time-to-detection between a human-operated attack (intermittent) and this agent-operated chain (continuous)?
  source: Track-C-SOC-Engineer/Module-06-RedTeamPerspective.md
recommendation: |-
  Defense in depth: Agent Builder governance (Session 02) prevents the ungoverned agent from Stage 1; Global Secure Access (Session 03) blocks connections to uncategorized MCP servers at the network level; and hardening internet-exposed AI platforms (patching Langflow, no public exposure without a WAF) closes the original entry point.

  Detection rule: P05-Q8 (chain correlation: 3 or more distinct stages from the same AgentId within a 60-minute window). No dedicated rule name in the workshop playbook.
detection:
  library:
    - P05-Q8
  suggestedRule:
    name: Agentic Multi-Stage Attack Chain Correlation (Proposed)
    severity: Critical
    frequency: Scheduled query, every 5 min (P05-Q8)
frameworks:
  atlas:
    - AML.T0051
    - AML.T0040
  owasp:
    - ASI04
    - ASI05
validation:
  status: documented
  date: 2026-10-21
  notes: Workshop exercise of Track C, Module 06, run against a demo tenant. Per-step evidence is not recorded in this file. The detection query carries its own validation status in the KQL library.

lab:
  kind: tenant-exercise
  effects: potential-impact
  title: One agent, four stages, no human pause
  objective: Simulate the observable middle of the JadePuffer pattern (discovery, credential access, lateral movement, bulk file operation) under one agent identity in a compressed window, see whether the chain-correlation rule fires before you reach the stage that would matter in a real incident, then repeat the credential-access, lateral-movement and bulk-file stages under a least-privilege identity to see which stage each individual scoping decision stops.
  scopeNote: "This lab reproduces 4 of the path's 7 stages (discovery, credential access, lateral movement, bulk file operation), simulated by hand under one agent identity, then repeats stages 3, 4 and 7 under a second, least-privilege identity to show where defense in depth would have stopped the chain even granting that Stage 1 (builder-001) succeeded. Stage 1 itself (the real Langflow CVE-2025-3248 exploit) and the final encryption/ransom stages are not reproduced: this lab tests whether the chain-correlation query fires and where least privilege breaks the chain, not the exploit chain itself. It does not attempt a hardened variant of Stage 1 / builder-001: that control (Agent Builder sharing restriction) is a tenant-wide setting with no clean second variant, as builder-001's own lab notes."
  estimatedMinutes: 40
  costEstimate: "Low: the simulated stages use existing SharePoint sites, an existing Key Vault and the Foundry resource from builder-001; no new paid resources. Not measured otherwise."
  licenses:
    - The ungoverned agent from builder-001 (this lab reuses it rather than recreating it)
    - A second agent or identity for the hardened-variant comparison, with no other relationship to builder-001's ungoverned agent required
    - A Key Vault with at least one secret, where the vulnerable identity can read the value and the hardened identity can only list the secret's name
    - SharePoint sites with files the agent can enumerate and copy
    - A group or role the agent can attempt to add itself to
    - Log Analytics workspace ingesting CloudAppEvents
  safety:
    scope: Demo tenant only. This lab never encrypts or deletes anything; "Stage 7" is simulated as a bulk download or copy, which is reversible, not as destruction.
    writes: Read access to Key Vault secrets and environment variables, a bulk copy or download of 20+ files, one attempted (and ideally rejected) group or role membership change on the vulnerable identity, and the same three attempts repeated (and expected to be rejected or capped) on the hardened identity.
    revert: Remove any group or role membership either identity's attempt actually succeeded in creating, and delete the copied files from wherever either agent placed them.
  architecture:
    summary: "The same ungoverned agent created in builder-001 is extended with the specific tools each simulated stage needs, then driven through the stages in scope (see scopeNote) by hand, one legitimate-looking tool call at a time, inside a 60-minute window, so the correlation query has something to correlate. Builder-001's bare agent has only an unrestricted system prompt: it holds none of these tools or permissions on its own, so provisioning them is part of this lab's own setup, not something inherited for free."
    resources:
      - name: red-team-test-agent (from builder-001)
        purpose: Drives all four simulated stages under one AgentId, which is what the correlation query keys on.
        createdBy: existing
      - name: Additional tools and permissions on the agent's identity (vulnerable variant)
        purpose: "Four over-provisioned capabilities builder-001's bare agent does not have: SharePoint search/enumeration across all sites, a Key Vault secret-READ tool (GET on secret value), directory permission to add itself to a group or role, and an uncapped bulk file download/copy tool. Added for this exercise only."
        createdBy: manual
      - name: Additional tools and permissions on a second agent identity (hardened variant)
        purpose: "The same four capability slots, each scoped to least privilege: SharePoint search limited to one site, Key Vault access scoped to LIST only (no GET on secret value), no directory permission to self-add to any group or role, and a bulk download/copy tool capped well under the 20-file threshold the chain's Stage 7 and the correlation query assume. Added for this exercise only, on a second identity so the vulnerable run's evidence is not overwritten."
        createdBy: manual
      - name: Key Vault
        purpose: Target for the simulated credential-access stage (a read of an existing secret, nothing new provisioned on the vault itself).
        createdBy: existing
      - name: SharePoint sites
        purpose: Target for the discovery and bulk-file-operation stages.
        createdBy: existing
      - name: Log Analytics workspace
        purpose: Receives CloudAppEvents, the table the chain-correlation query reads.
        createdBy: existing
    principals:
      - name: red-team-test-agent's identity (vulnerable variant)
        required:
          - SharePoint read/search access across all sites, Key Vault secret-READ access, directory permission to add itself (or a service principal it controls) to a group or role, and an uncapped bulk file download/copy tool; none of this is present from builder-001 alone and must be granted for this exercise
        helpful: []
      - name: Second identity (hardened variant)
        required:
          - SharePoint read/search access scoped to one site, Key Vault access scoped to LIST only, no directory permission to self-add to a group or role, and a bulk download/copy tool capped below 20 files
        helpful: []
  flow:
    setup:
      - Confirm the agent from builder-001 is still available and that you can drive it through a conversation that results in real tool calls, not just text.
      - "Add the four over-provisioned capabilities listed under architecture.resources to the agent (vulnerable variant): without them the simulated stages below have nothing real to call, and the correlation query has nothing to correlate."
      - Create a second identity (or a second agent built the same way) and grant it only the least-privilege versions of the same four capability slots (hardened variant), for the comparison run.
      - Note both agents' AgentId if you can find them, so you can filter the correlation query to each one specifically while other tenant activity is happening.
    attack:
      - step: 'Stage 2, discovery: ask the agent to enumerate SharePoint sites, list users, and list connected services, through its own tool calls, not through you doing it manually.'
        evidence: The agent's tool-call log shows at least one SharePoint, directory or service-enumeration call completed.
      - step: 'Stage 3, credential access: ask the agent to read a Key Vault secret, check Foundry environment variables, and look for API keys in any configuration documents it can reach.'
        evidence: At least one credential- or secret-read tool call completes, against an existing demo secret, not a real one.
      - step: 'Stage 4, lateral movement: ask the agent to add itself (or a service principal it controls) to an additional group or role.'
        evidence: 'The attempt is made and its result (accepted or rejected) is recorded; a rejection is itself useful evidence about where the chain would actually stop.'
      - step: 'Stage 7, bulk file operation: ask the agent to download or copy 20 or more files, from more than one site, in a single session.'
        evidence: A bulk copy or download tool call completes against the demo sites, and the files land somewhere you can delete them from afterward.
      - step: Run P05-Q8 (the real chain-correlation query from the KQL library, not the simplified one in builder-001/chain-001's own workshop.verificationQuery fields), scoped to the agent's AgentId if you captured it, before and after the four simulated stages.
        evidence: "P05-Q8's own output field is StagesPresent, a count of 0-4 of its four action-category buckets (discovery, credential access, lateral movement, encryption/destruction signals) seen for that AgentId; the query filters to StagesPresent >= 3. Record the value and which of the four simulated stages it corresponds to, not a different field or threshold from an unrelated query."
      - step: Repeat stage 3 (credential access) against the hardened-variant identity, asking it to read the same Key Vault secret's value.
        evidence: The call is rejected (the identity can list the secret's name but not GET its value), or the agent reports it cannot retrieve the content. Record the rejection; it is the evidence, not a failure of the exercise.
      - step: Repeat stage 4 (lateral movement) against the hardened-variant identity, asking it to add itself to the same group or role.
        evidence: The attempt is rejected, since this identity was never granted the directory permission to self-add.
      - step: Repeat stage 7 (bulk file operation) against the hardened-variant identity, asking it to download or copy 20 or more files from more than one site, the same request as the vulnerable run.
        evidence: The operation either fails outright or stops at the capped file count, well under the 20-file threshold the correlation query and Stage 7 both assume.
      - step: Run P05-Q8 again, scoped to the hardened-variant identity's AgentId, for the same window.
        evidence: StagesPresent stays at or near 1 (discovery only, if that stage was also attempted on this identity) instead of the 3+ the vulnerable identity reached, showing where least privilege, not detection, actually broke the chain.
    cleanup:
      - Delete or revert any file copies the bulk-operation stage produced.
      - Remove the group or role membership from Stage 4 if it was accepted.
      - Remove the four tools and permissions added in setup from both the vulnerable-variant and hardened-variant identities; they do not belong on either outside this exercise.
      - Remove or disable the second (hardened-variant) identity if it was created solely for this comparison.
    teardown:
      - No infrastructure beyond builder-001's agent, the hardened-variant second identity, and the tools added to each was created; tearing both identities down (see builder-001's lab for the first) removes everything this lab drove, once the tool removal in cleanup is done.
  defend:
    prevent:
      - "Close the entry point this chain assumes: Agent Builder governance (builder-001's own defend.prevent) stops the ungoverned agent that makes stages 2-7 possible in the first place."
      - "Grant agent identities least privilege for each tool slot individually, not just at agent-creation time: as the hardened variant in this lab shows, capping Key Vault to LIST, removing self-group-add, and bounding bulk download each independently stop a later stage even when Stage 1 (builder-001) already succeeded."
      - Patch and harden any internet-exposed AI development platform (Langflow, Flowise, n8n, Dify) with the same rigor as a production system; do not expose one without a WAF.
      - "Monitor for compressed multi-stage chains from a single agent identity: the signal is how many distinct action types appear close together in time, not the severity of any one action."
    detect:
      queries:
        - P05-Q8
      events:
        - source: CloudAppEvents
          operation: 3 or more distinct high-level action-type categories from the same AgentId within a 60-minute window
          note: "Per the KQL library's own note on this query: it runs without errors in Advanced Hunting as of October 2026, but had 0 agent ActionTypes to correlate on the validation tenant, so it has not been run against live events. Confirm on your own tenant's real telemetry, not just that the query parses."
  transcript:
    summary: Not run in this repository. The steps and the stage table come from Track C, Module 06 (Attack 6, the JadePuffer simulation), itself written as instructional content for a demo-tenant workshop.
    observations: []
  validation:
    status: documented
    date: 2026-11-04
    notes: This lab restructures the Module 06, Attack 6 exercise into the path/lab schema. It was not independently run for this file; it depends on builder-001's lab for the vulnerable-variant agent identity, and the detection query's "not run against live events" status is carried over from the KQL library rather than resolved here. The hardened-variant comparison added on 2026-11-04 (least-privilege second identity for stages 3, 4 and 7) was designed from the same least-privilege reasoning already validated for agent-001's write-capable-vs-read-only comparison in this repository, but this specific least-privilege Key Vault/directory/download configuration has not itself been provisioned or run against a tenant.
